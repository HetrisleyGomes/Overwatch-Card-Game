{% extends 'base.html' %}
{% block conteudo %}
<link rel="stylesheet" href="../static/styles/index.css">

<!-- TOPO -->
<div class="header">
    <div class="header-item" id="username">
        <div><img src="{{ url_for('static', filename='logos/' + user.profile_img ) }}" loading="lazy"></div>
        <div><span>{{ user.nome }}</span></div>
    </div>
    <div class="header-item">
        <div class="header-item">
            <label class="theme-switch">
            <input type="checkbox" id="mode-toggle">
            <span class="slider">
                <span class="icon">
                </span>
            </span>
        </label>
        </div>
        <div class="header-item" id="points">{{ _('prisms') }}: <div class="points_box"><span id="pontos">{{ user.impetos }}</span></div></div>
        <div class="header-item" id="points">{{ _('points') }}: <div class="points_box"><span id="pontos">{{ user.pontos }}</span></div></div>
    </div>
</div>

{% if ev %}
    <div class="subhead-event">
        <span class="event">
            {{ ev["nome"] }}
        </span>
    </div>
{% endif %}

{% block centro %}

{% endblock %}

<div id="help-button">?</div>

<div id="help-modal">
    <div class="help-window">
        <button class="help-close" onclick="closeHelp()">✕</button>
        <h2 id="help-title">{{ global_tips['title'] }}</h2>
        <div id="help-content" style="white-space: pre-line;">{{ global_tips['content'] }}</div>
    </div>
</div>


<!-- RODAPÉ -->
<div class="footer">
    <a href="{{ url_for('main.home') }}">
        <button class="button premium-button {% if request.endpoint == 'main.home' %}ativo{% endif %}"
                {% if request.endpoint == 'main.home' %}disabled{% endif %}>
            {{ _('home') }}
        </button>
    </a>
    <a href="{{ url_for('main.inventory') }}">
        <button class="button premium-button {% if request.endpoint == 'main.inventory' %}ativo{% endif %}"
                {% if request.endpoint == 'main.inventory' %}disabled{% endif %}>
            {{ _('inventory') }}
        </button>
    </a>
    
    <a href="{{ url_for('main.collection') }}">
        <button class="button premium-button {% if request.endpoint == 'main.collection' %}ativo{% endif %}"
                {% if request.endpoint == 'main.collection' %}disabled{% endif %}>
            {{ _('collections') }}
        </button>
    </a>
    <a href="{{ url_for('main.store') }}">
        <button class="button premium-button {% if request.endpoint == 'main.store' %}ativo{% endif %}"
                {% if request.endpoint == 'main.store' %}disabled{% endif %}>
            {{ _('store') }}
            {% if not user.has_already_get_daily_bonus and request.endpoint != 'main.store' %}
                <div class="notification"></div>
            {% endif %}
        </button>
    </a>
    <a href="{{ url_for('main.settings') }}">
        <button class="button premium-button {% if request.endpoint == 'main.settings' %}ativo{% endif %}"
                {% if request.endpoint == 'main.settings' %}disabled{% endif %}>
            {{ _('settings') }}
        </button>
    </a>
</div>
<div id="global-tooltip"></div>
<script>
    // Tooltips
    const tooltip = document.getElementById("global-tooltip");
    function initializeTooltips() {
        document.addEventListener("mousemove", (e) => {
            const tooltipClass = e.target.closest(".tooltipClass");
            const icon = e.target.closest(".icon_ref")
            if ((!tooltipClass || !tooltipClass.dataset.tooltip) && !icon) {
                tooltip.classList.remove("show");
                return;
            } 
            
            if (tooltipClass) {
                tooltip.innerHTML = tooltipClass.dataset.tooltip.replace(/\n/g, "<br>");
            } else if (icon){
                value = ""
                switch (icon.dataset.tooltip) {
                    case "golden.png":
                        value = "Arma dourada";
                        break;
                    case "alter.png":
                        value = "Arte alternativa";
                        break;
                }
                tooltip.innerHTML = value;
            }
            
            tooltip.style.left = `${e.clientX}px`;
            tooltip.style.top = `${e.clientY + 16}px`;
            tooltip.classList.add("show");
        });

        document.addEventListener("mouseleave", () => {
            tooltip.classList.remove("show");
        });
    }

    // Botão de ajuda
    function openHelp(){
        document.getElementById("help-modal").classList.add("show");
    }

    function closeHelp(){
        document.getElementById("help-modal").classList.remove("show");
    }

    document.getElementById("help-button").onclick = () => {
        openHelp();
    };


    // Modo noturno
    const toggle = document.getElementById("mode-toggle");

    toggle.addEventListener("change", () => {
        document.documentElement.dataset.mode =
            toggle.checked
                ? "dark"
                : "light";

        localStorage.setItem(
            "mode",
            document.documentElement.dataset.mode
        );
    });

    const mode = localStorage.getItem("mode") || "light";

    document.documentElement.dataset.mode = mode;
    toggle.checked = mode === "dark";

    // TEMA
    const selectedTheme = {{ user.theme | tojson }};
    var tema = document.documentElement.dataset.theme;
    if (tema != selectedTheme){
        document.documentElement.dataset.theme = selectedTheme;
    };
    localStorage.setItem("theme", selectedTheme);

    initializeTooltips()
</script>
{% endblock %}
