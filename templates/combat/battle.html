{% extends 'base.html' %}
{% block conteudo %}
<link rel="stylesheet" href="../static/styles/carta.css">
<link rel="stylesheet" href="../static/styles/battle.css">

<div class="battle-container">

    <!-- TOPO -->
    <div class="top-bar">
        <div class="player player-left">
            <img src="" class="avatar" id="avatar-1">
            <div class="hp-bar">
                <div class="hp-fill" id="hp-p1"></div>
            </div>
        </div>

        <div class="center">
            <div class="timer" id="timer">
                {% if game_state['mode'] == 'pve' %}
                    PvE
                {% else %}
                        30
                {% endif %}
            </div>
            <span class="phase-view" id="phase-view">Pré Game</span>
        </div>

        <div class="player player-right">
            <img src="" class="avatar" id="avatar-2">
            <div class="hp-bar">
                <div class="hp-fill" id="hp-p2"></div>
            </div>
        </div>
    </div>


    <!-- ÁREA DE COMBATE -->
    <div class="arena">
        <div class="players_spaces">
            <div class="continuous-effect-slot" id="cont-slot-p1"></div>
            <div class="card-slot" id="slot-p1">
                <span>Player 1</span>
            </div>
            <div class="effects-slot" id="effects-p1"></div>
        </div>

        <div class="players_spaces">
            <div class="continuous-effect-slot" id="cont-slot-p2"></div>
            <div class="card-slot" id="slot-p2">
                <span>Player 2</span>
            </div>
            <div class="effects-slot" id="effects-p2"></div>
        </div>
    </div>


    <!-- ÁREA DO PLAYER -->
    <div class="bottom-area">

        <!-- Deck -->
        <div class="deck" id="deck">
            <div class="card-layer"></div>
            <div class="card-layer"></div>
            <div class="card-layer"></div>
            <span>Deck</span>
        </div>

        <!-- Mão -->
        <div class="hand" id="hand">
            <!-- cartas via JS -->
        </div>

        <!-- Descarte -->
        <div class="discard">
            <span>{{ _("descarte") }}</span>
        </div>

    </div>
    <div id="global-tooltip"></div>
</div>

<audio id="background-music" loop autoplay>
  Your browser does not support the audio element.
</audio>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script>
const socket = io();
const STATIC_URL = "{{ url_for('static', filename='') }}";

var game_state = {{ game_state | tojson }};
const players = {{ players | tojson }};
var userId = {{ session["user_id"] }};

const DICT_LANG = game_state["dict_lang"];
const COMBAT_TIPS = game_state["combat_tips"];

var player_1 = players.find(j => j.id == userId);
var player_2 = players.find(j => j.id != userId);
</script>
<script src="{{ url_for('static', filename='scripts/combate_music.js')}}"></script>
<script src="{{ url_for('static', filename='scripts/combate_timer.js')}}"></script>
<script src="{{ url_for('static', filename='scripts/combate_animations.js')}}"></script>
<script src="{{ url_for('static', filename='scripts/combate_sockets.js')}}"></script>
<script src="{{ url_for('static', filename='scripts/combate_controller.js')}}"></script>
{% endblock %}
